<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallpaper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* WebGL wallpaper — rendered at 1/3 resolution, scaled up via CSS */
    #wallpaper {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      /* Light mode: invert so the shader's dark-blue palette becomes warm light tones */
      filter: invert(1) hue-rotate(180deg);
    }

    @media (prefers-color-scheme: dark) {
      #wallpaper { filter: none; }
    }

    /* Canvas 2D dust overlay — full resolution, pointer-events off */
    #dust {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="wallpaper"></canvas>
  <canvas id="dust"></canvas>

  <script>
    // ─── Shared helpers ───────────────────────────────────────────────────────

    const TARGET_FPS      = 24;
    const FRAME_INTERVAL  = 1000 / TARGET_FPS;

    let onBattery = false;

    if ('getBattery' in navigator) {
      navigator.getBattery().then(battery => {
        onBattery = !battery.charging;
        battery.addEventListener('chargingchange', () => { onBattery = !battery.charging; });
      });
    }

    // ─── Wallpaper (WebGL) ────────────────────────────────────────────────────

    const VS_SOURCE = `
      attribute vec2 a_pos;
      void main() { gl_Position = vec4(a_pos, 0, 1); }
    `;

    const FS_SOURCE = `
      precision highp float;
      uniform vec2  iResolution;
      uniform float iTime;

      #define S(a,b,t) smoothstep(a,b,t)

      mat2 Rot(float a) {
        float s = sin(a), c = cos(a);
        return mat2(c, -s, s, c);
      }

      vec2 hash(vec2 p) {
        p = vec2(dot(p, vec2(2127.1, 81.17)), dot(p, vec2(1269.5, 283.37)));
        return fract(sin(p) * 43758.5453);
      }

      float noise(in vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        float n = mix(
          mix(dot(-1.0 + 2.0 * hash(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0)),
              dot(-1.0 + 2.0 * hash(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0)), u.x),
          mix(dot(-1.0 + 2.0 * hash(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0)),
              dot(-1.0 + 2.0 * hash(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0)), u.x), u.y);
        return 0.5 + 0.5 * n;
      }

      vec2 swirl(vec2 uv, vec2 center, float strength, float time) {
        vec2 delta = uv - center;
        float dist  = length(delta);
        float angle = strength * exp(-dist * 2.8) * sin(time * 0.3 + dist * 3.0);
        float s = sin(angle), c = cos(angle);
        return center + mat2(c, -s, s, c) * delta;
      }

      vec3 getColor(vec2 wp, float yPulse, float pPulse, float gPulse) {
        vec3 deepNavy      = vec3(0.04, 0.07, 0.28);
        vec3 cobalt        = vec3(0.10, 0.25, 0.65);
        vec3 cerulean      = vec3(0.15, 0.42, 0.72);
        vec3 indigo        = vec3(0.18, 0.10, 0.52);
        vec3 purple        = vec3(0.35, 0.15, 0.60);
        vec3 lavender      = vec3(0.42, 0.30, 0.72);
        vec3 vibrantYellow = vec3(0.98, 0.35, 0.60);
        vec3 softPink      = vec3(0.75, 0.30, 0.48);
        vec3 lightGreen    = vec3(0.40, 0.90, 0.50);

        float x = (wp * Rot(radians(-5.))).x;
        float y = wp.y;

        vec3 blueBase    = mix(deepNavy, cobalt,      S(-.5, .0, x));
        blueBase         = mix(blueBase, cerulean,    S(.0,  .4, x));
        vec3 purpleLayer = mix(indigo,   purple,      S(-.4, .1, x));
        purpleLayer      = mix(purpleLayer, lavender, S(.0,  .5, x));
        vec3 col = mix(blueBase, purpleLayer, S(.3, -.2, y) * 0.55);

        float yellowRegion = noise(wp * 2.2 + vec2(iTime * 0.04, 0.0));
        col = mix(col, mix(cobalt, vibrantYellow, 0.85), S(0.62, 0.80, yellowRegion) * yPulse * 0.80);

        float pinkRegion = noise(wp * 2.5 + vec2(0.0, iTime * 0.03 + 5.5));
        col = mix(col, mix(purple, softPink, 0.70), S(0.64, 0.80, pinkRegion) * pPulse * 0.65);

        float greenRegion = noise(wp * 2.0 + vec2(iTime * 0.035 + 2.3, iTime * 0.025 + 8.1));
        col = mix(col, mix(cerulean, lightGreen, 0.65), S(0.63, 0.79, greenRegion) * gPulse * 0.55);

        return col;
      }

      void main() {
        vec2 fragCoord = gl_FragCoord.xy;
        vec2 uv    = fragCoord / iResolution.xy;
        float ratio = iResolution.x / iResolution.y;

        vec2 pan = vec2(
          sin(iTime * 0.031) * 0.18 + cos(iTime * 0.019) * 0.09,
          cos(iTime * 0.027) * 0.14 + sin(iTime * 0.023) * 0.07
        );
        vec2 pannedUV = uv + pan;

        vec2 c1 = vec2(0.35 + 0.12 * sin(iTime * 0.11), 0.5 + 0.10 * cos(iTime * 0.09));
        vec2 c2 = vec2(0.65 + 0.10 * cos(iTime * 0.13), 0.5 + 0.12 * sin(iTime * 0.07));

        vec2 suv = pannedUV;
        suv = swirl(suv, c1,  1.8, iTime);
        suv = swirl(suv, c2, -1.4, iTime + 1.5);

        vec2 tuv = suv;
        tuv -= .5;

        float degree = noise(vec2(iTime * .1, tuv.x * tuv.y));
        tuv.y *= 1. / ratio;
        tuv *= Rot(radians((degree - .5) * 720. + 180.));
        tuv.y *= ratio;

        float frequency = 5.;
        float amplitude = 30.;
        float speed = iTime * 2.;
        tuv.x += sin(tuv.y * frequency + speed) / amplitude;
        tuv.y += sin(tuv.x * frequency * 1.5 + speed) / (amplitude * .5);

        vec2 dq = vec2(
          noise(tuv * 2.0 + vec2(iTime * 0.02,        0.5)),
          noise(tuv * 2.0 + vec2(1.3, iTime * 0.02 + 3.7))
        );
        vec2 dr = vec2(
          noise(tuv * 2.0 + 2.2 * dq + vec2(iTime * 0.015 + 1.7, 9.2)),
          noise(tuv * 2.0 + 2.2 * dq + vec2(8.3, iTime * 0.015 + 2.8))
        );
        vec2 wtuv = tuv + 0.35 * dr;

        float accentNoise1 = noise(vec2(iTime * 0.07, 1.3));
        float accentNoise2 = noise(vec2(iTime * 0.05 + 4.7, 2.9));
        float accentNoise3 = noise(vec2(iTime * 0.06 + 9.1, 5.3));
        float yellowPulse  = pow(max(0.0, sin(accentNoise1 * 6.28)), 2.5);
        float pinkPulse    = pow(max(0.0, sin(accentNoise2 * 6.28 + 2.1)), 2.5);
        float greenPulse   = pow(max(0.0, sin(accentNoise3 * 6.28 + 4.2)), 2.5);

        vec3 base = getColor(wtuv, yellowPulse, pinkPulse, greenPulse);

        vec2 vignUV = uv * 2.0 - 1.0;
        float vign  = 1.0 - dot(vignUV, vignUV) * 0.15;
        base *= vign;

        gl_FragColor = vec4(base, 1.0);
      }
    `;

    function compileShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader error:', gl.getShaderInfoLog(shader));
      }
      return shader;
    }

    (function initWallpaper() {
      const canvas = document.getElementById('wallpaper');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) { console.error('WebGL not supported'); return; }

      const vs      = compileShader(gl, gl.VERTEX_SHADER,   VS_SOURCE);
      const fs      = compileShader(gl, gl.FRAGMENT_SHADER, FS_SOURCE);
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      gl.useProgram(program);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const aPos = gl.getAttribLocation(program, 'a_pos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      const uRes  = gl.getUniformLocation(program, 'iResolution');
      const uTime = gl.getUniformLocation(program, 'iTime');

      function resize() {
        canvas.width  = Math.floor(window.innerWidth  / 3);
        canvas.height = Math.floor(window.innerHeight / 3);
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);

      const startTime = performance.now();
      let lastFrame   = 0;
      let handle      = null;

      function render(ts) {
        handle = requestAnimationFrame(render);
        if (ts - lastFrame < FRAME_INTERVAL) return;
        lastFrame = ts;
        const t = (ts - startTime) / 1000;
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uTime, t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      function start() { if (!handle && !onBattery && !document.hidden) handle = requestAnimationFrame(render); }
      function stop()  { if (handle) { cancelAnimationFrame(handle); handle = null; } }

      document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
      start();
    })();

    // ─── Dust (Canvas 2D) ─────────────────────────────────────────────────────

    (function initDust() {
      const canvas       = document.getElementById('dust');
      const ctx          = canvas.getContext('2d');
      const PARTICLE_COUNT = 231;
      const WIND_SCALE   = 4.5;
      const densityPhase = Math.random() * Math.PI * 2;

      let particles = [];

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function spawnParticles() {
        const W = window.innerWidth;
        const H = window.innerHeight;
        particles = Array.from({ length: PARTICLE_COUNT }, () => ({
          x:                   Math.random() * W,
          y:                   Math.random() * H,
          size:                0.6 + Math.random() * 1.6,
          opacityMin:          0,
          opacityMax:          0.15 + Math.random() * 0.30,
          fadePhase:           Math.random() * Math.PI * 2,
          fadeFreq:            0.10 + Math.random() * 0.30,
          activationThreshold: Math.random(),
          phase:               Math.random() * Math.PI * 2,
          turbFreq:            0.15 + Math.random() * 0.25,
          turbAmpX:            8  + Math.random() * 14,
          turbAmpY:            5  + Math.random() * 8,
          colorPhase:          Math.random() * Math.PI * 2,
          colorFreq:           0.030 + Math.random() * 0.060,
        }));
      }

      resize();
      spawnParticles();
      window.addEventListener('resize', () => { resize(); spawnParticles(); });

      const startTime = performance.now();
      let lastFrame   = 0;
      let lastT       = 0;
      let handle      = null;

      function render(ts) {
        handle = requestAnimationFrame(render);
        if (ts - lastFrame < FRAME_INTERVAL) return;
        lastFrame = ts;

        const t  = (ts - startTime) / 1000;
        const dt = Math.min(t - lastT, 0.1);
        lastT = t;

        const W = canvas.width;
        const H = canvas.height;

        // Derivative of wallpaper pan — same formula as the Angular component
        const windNX =  Math.cos(t * 0.031) * (0.031 * 0.18)
                      - Math.sin(t * 0.019) * (0.019 * 0.09);
        const windNY = -Math.sin(t * 0.027) * (0.027 * 0.14)
                      + Math.cos(t * 0.023) * (0.023 * 0.07);
        const windX  = windNX * W * WIND_SCALE;
        const windY  = windNY * H * WIND_SCALE;

        const d1      = Math.sin(t * 0.020 + densityPhase);
        const d2      = Math.sin(t * 0.008 + densityPhase + 1.3);
        const density = Math.max(0, Math.min(1, 0.5 + 0.32 * d1 + 0.22 * d2));

        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        const globalHueDrift = Math.sin(t * 0.019 + densityPhase) * 0.5
                             + Math.cos(t * 0.013 + densityPhase + 1.3) * 0.5;
        const globalHue = isDark
          ? 245 + 40 * globalHueDrift
          :  45 + 25 * globalHueDrift;

        ctx.clearRect(0, 0, W, H);

        const margin = 12;
        for (const p of particles) {
          const activateAlpha = Math.max(0, Math.min(1, (density - p.activationThreshold) / 0.12));
          if (activateAlpha === 0) continue;

          const tx = Math.sin(t * p.turbFreq + p.phase)             * p.turbAmpX;
          const ty = Math.cos(t * p.turbFreq * 0.7 + p.phase + 1.3) * p.turbAmpY;

          p.x += (windX + tx) * dt;
          p.y += (windY + ty) * dt;

          if (p.x < -margin)    p.x += W + margin * 2;
          if (p.x > W + margin) p.x -= W + margin * 2;
          if (p.y < -margin)    p.y += H + margin * 2;
          if (p.y > H + margin) p.y -= H + margin * 2;

          const hue = globalHue + 12 * Math.sin(t * p.colorFreq + p.colorPhase);
          ctx.fillStyle = isDark
            ? `hsl(${hue}, 38%, 80%)`
            : `hsl(${hue}, 42%, 15%)`;

          const fadeAlpha = p.opacityMin +
                            (p.opacityMax - p.opacityMin) *
                            (0.5 + 0.5 * Math.sin(t * p.fadeFreq + p.fadePhase));
          ctx.globalAlpha = Math.min(1, activateAlpha * fadeAlpha * (isDark ? 1.0 : 1.6));
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.globalAlpha = 1;
      }

      function start() { if (!handle && !onBattery && !document.hidden) handle = requestAnimationFrame(render); }
      function stop()  { if (handle) { cancelAnimationFrame(handle); handle = null; } }

      document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
      start();
    })();
  </script>
</body>
</html>
